<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#05030C">
  <title>EPIC ШАШКИ</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="app.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05030C;
      -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; }
    #stage, #ui { position: fixed; inset: 0; }
    #stage { z-index: 0; }
    #ui { z-index: 10; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="ui"></div>
  <script src="app.js"></script>
</body>
</html>
